<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0f0e" />
    <link rel="icon" href="data:," />
    <title>靈隱 · 冷泉 — a procedural valley</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene-canvas" aria-label="A cinematic procedural valley inspired by Lingyin Temple"></canvas>

      <div id="ui">
        <header class="brand">
          <div class="seal">靈</div>
          <div class="brand-text">
            <h1>靈隱</h1>
            <p>LINGYIN · COLD SPRING</p>
          </div>
        </header>

        <div class="caption" id="caption">山門 · MORNING MIST</div>

        <nav id="shot-nav" class="shots" aria-label="Viewpoints"></nav>

        <div class="controls-row">
          <button id="tour-btn" type="button">巡游</button>
          <button id="quality-btn" type="button">精細</button>
          <span id="sample-count">ACCUM 00/48</span>
        </div>

        <div class="hint">拖动环视 · 滚轮远近 · 1–5 切换机位 · T 巡游</div>
        <div class="credit">程序化实时场景 · 无外部模型与贴图</div>
      </div>

      <div id="loading">
        <div class="load-inner">
          <div class="load-cn">靈隱</div>
          <div class="load-sub">正在生成山谷 · GROWING THE VALLEY</div>
          <div class="load-rule"><i></i></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
