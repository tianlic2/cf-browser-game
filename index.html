<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="穿越火线风格的浏览器第一人称射击游戏，基于 HTML + Three.js" />
    <title>战术突击 · FPS 第一人称射击</title>
    <!-- 内联 SVG 准星图标。用 data URI 是为了免掉一次 /favicon.ico 请求
         （没有它，每次打开控制台都会挂一条 404，公开站点上很显眼）。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161616'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23ff9b1a' stroke-width='2.6'/%3E%3Cpath d='M16 2.5v7.5M16 22v7.5M2.5 16H10M22 16h7.5' stroke='%23ff9b1a' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!-- 路径一律用「相对当前文档」的写法：本地 http.server 与 GitHub Pages 的项目页
         （tianlic2.github.io/cf-browser-game/）两种根目录深度都能跑。写成 /styles/… 这种
         绝对路径在项目页上会去根域找，整站 404。 -->
    <link rel="stylesheet" href="./styles/game.css" />
  </head>
  <body>
    <!-- 3D 渲染画布 -->
    <div id="viewport"></div>

    <!-- 命中/受击反馈层（血雾 / 命中标记 / 闪光白屏） -->
    <div id="fx-layer" class="fx-layer">
      <div class="flash-overlay" id="flashOverlay"></div>
      <!-- 高档连杀的全屏边缘辉光（一次性 CSS 动画，重触发靠 classList 移除/回流/加回） -->
      <div class="streak-flash" id="streakFlash"></div>
    </div>

    <!-- 狙击镜（AWM 右键开镜；再按一次升到二级变倍） -->
    <div id="scope" class="scope hidden">
      <div class="sc-tube">
        <div class="sc-vig"></div>
        <div class="sc-h"></div>
        <div class="sc-v"></div>
        <div class="sc-dot"></div>
      </div>
    </div>

    <!-- HUD 界面 -->
    <div id="hud" class="hud hidden">
      <div class="crosshair" id="crosshair">
        <span class="x x-top"></span>
        <span class="x x-bottom"></span>
        <span class="x x-left"></span>
        <span class="x x-right"></span>
        <span class="x x-dot"></span>
      </div>

      <!-- 顶部：团队竞技比分 + 回合倒计时（时间到按比分判胜负） -->
      <div class="hud-top">
        <div class="roundbar">
          <div class="rb-side rb-a">
            <span class="rb-team">我方</span>
            <span class="rb-score" id="teamScoreVal">0</span>
          </div>
          <div class="rb-mid">
            <span class="rb-time" id="roundTime">10:00</span>
            <span class="rb-limit">目标击杀 <b id="limitVal">40</b></span>
            <span class="rb-limit">敌人数 <b id="enemyNumVal">8</b></span>
          </div>
          <div class="rb-side rb-b">
            <span class="rb-score" id="enemyScoreVal">0</span>
            <span class="rb-team">敌方</span>
          </div>
        </div>
      </div>

      <!-- 右上：击杀信息条 -->
      <div class="killfeed" id="killfeed"></div>

      <!-- 中上：连杀播报（主标题 = 阶梯称号，见 main.js 的 streakLabel）。高档位会另起一层
           全屏边缘辉光（#streakFlash，在 .fx-layer 里）。 -->
      <div class="streak" id="streak"></div>

      <!-- 中上：连杀窗口倒计时（只要身上有连杀就一直挂着，条走完 = 连杀断）
           位置钉在播报标题正下方，两者同时在场时不打架。 -->
      <div class="sk-timer" id="streakTimer">
        <span class="sk-timer-num" id="streakTimerNum"></span>
        <span class="sk-timer-txt">连杀</span>
        <span class="sk-timer-track"><i id="streakTimerFill"></i></span>
      </div>

      <!-- 屏幕中心：击杀图标 -->
      <div class="killicon" id="killIcon"></div>

      <!-- 屏幕中心：受击方向指示 -->
      <div class="hitdir" id="hitdir"></div>

      <!-- 左下：聊天（敌人按你的表现评论 + 回车发言，位置与 CF 一致） -->
      <div class="chat" id="chat">
        <div class="chat-log" id="chatLog"></div>
        <div class="chat-input hidden" id="chatInputWrap">
          <span class="chat-tag">全部</span>
          <input id="chatInput" type="text" maxlength="60" autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <!-- 左下：生命值 -->
      <div class="hud-bottom-left">
        <div class="hp-row">
          <span class="hp-icon">✚</span>
          <span class="hp-num" id="hpVal">100</span>
        </div>
        <div class="hud-bar"><div class="hud-bar-fill" id="hpFill"></div></div>
      </div>

      <!-- 右下：武器名 + 弹药 -->
      <div class="hud-bottom-right">
        <div class="hud-weapon"><span class="bp-badge" id="bpBadge">背包 1</span><span class="wname" id="weaponName">AK-47</span></div>
        <div class="ammo-num" id="ammoVal">30 / 120</div>
        <div class="hud-bar"><div class="hud-bar-fill" id="ammoFill"></div></div>
      </div>

      <!-- 背包面板（B 打开/关闭，再用数字键 1/2/3 选背包） -->
      <div id="backpack" class="backpack hidden">
        <div class="bp-title">背包选择<small>（B 打开 / 关闭 · 限复活点安全区）</small></div>
        <div id="bpList" class="bp-list"></div>
        <div class="bp-hint" id="bpHint"></div>
      </div>

      <!-- 提示：换弹中 / 低血量 -->
      <div class="hud-toast" id="toast"></div>

      <!-- 阵亡界面：击杀者 + 武器 + 复活倒计时（死亡视角 3 秒，随后复活回出生点） -->
      <div id="deathScreen" class="death hidden">
        <div class="death-vig"></div>
        <div class="death-body">
          <div class="death-title">你被击杀</div>
          <div class="death-line">
            <span class="death-k" id="deathKiller">敌人</span>
            <span class="death-w" id="deathWeapon">步枪</span>
          </div>
          <div class="death-bar"><i id="deathFill"></i></div>
          <div class="death-tip">正在返回复活点…</div>
        </div>
      </div>

      <!-- 战绩面板（按住 Tab 显示，与 CF 一致） -->
      <div id="scoreboard" class="scoreboard hidden">
        <div class="sb-panel">
          <div class="sb-head">
            <div class="sb-team sb-blue">
              <span class="sb-tname">我方 · 保卫者</span>
              <span class="sb-tscore" id="sbBlueScore">0</span>
            </div>
            <div class="sb-mid">
              <div class="sb-title">战术突击</div>
              <div class="sb-sub">TRANSPORT SHIP · 团队竞技</div>
              <div class="sb-target">目标击杀 <b id="sbLimit">40</b></div>
            </div>
            <div class="sb-team sb-red">
              <span class="sb-tscore" id="sbRedScore">0</span>
              <span class="sb-tname">敌方 · 潜伏者</span>
            </div>
          </div>
          <div class="sb-cols">
            <div class="sb-col">
              <div class="sb-colhead"><span>名字</span><span>击杀</span><span>死亡</span></div>
              <div class="sb-rows" id="sbBlueRows"></div>
            </div>
            <div class="sb-col">
              <div class="sb-colhead"><span>名字</span><span>击杀</span><span>死亡</span></div>
              <div class="sb-rows" id="sbRedRows"></div>
            </div>
          </div>
          <div class="sb-foot">按住 <b>TAB</b> 查看战绩</div>
        </div>
      </div>
    </div>

    <!-- 开始菜单（CF 大厅风格：炭黑面板 + 琥珀橙强调 + 斜切角） -->
    <div id="menu" class="menu">
      <div class="menu-panel">
        <div class="menu-brand">TACTICAL ASSAULT</div>
        <h1 class="menu-title">战术突击</h1>
        <p class="menu-sub">运输船 · 团队竞技</p>
        <div class="menu-setup">
          <div class="ml-title">对局设置<small>进入战场后可用 + / - 随时增减敌人</small></div>
          <div class="ml-rows">
            <div class="ml-row">
              <span class="ml-label">敌人数量</span>
              <div class="ml-stepper">
                <button class="ml-step-btn" id="enemyMinus" aria-label="减少敌人数量">−</button>
                <span class="ml-step-val" id="enemyCountVal">8</span>
                <button class="ml-step-btn" id="enemyPlus" aria-label="增加敌人数量">+</button>
              </div>
            </div>
            <div class="ml-row">
              <span class="ml-label">难度</span>
              <div class="ml-seg" id="mlDiff"></div>
            </div>
          </div>
        </div>
        <button class="menu-btn" id="startBtn">进入战场</button>
      </div>
    </div>

    <!-- 结算画面 -->
    <div id="gameover" class="menu hidden">
      <div class="menu-panel">
        <h1 class="menu-title" id="goTitle">胜利</h1>
        <p class="menu-sub" id="goSub">TEAM VICTORY</p>
        <div class="gameover-stats">
          <div><span>我方击杀</span><b id="goMine">0</b></div>
          <div><span>敌方击杀</span><b id="goEnemy">0</b></div>
          <div><span>目标</span><b id="goLimit">40</b></div>
        </div>
        <button class="menu-btn" id="restartBtn">再来一局</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
